name: Generate Gonorego & Retro Voice

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Clean Romaji Script
        run: |
          python convert.py
          ls -la romaji.txt

      - name: Synthesize 4 Gonorego Pitch & Speed Patterns
        run: |
          # 1. 【本命】ドス・無機質フラット・適正速度 (rate 140, pbas -10, pmod 0)
          echo -n "[[rate 140]][[pbas -10]][[pmod 0]]" > p1.txt
          cat romaji.txt >> p1.txt
          say -v Whisper -f p1.txt -o p1.aiff
          afconvert -f WAVE -d LEI16 p1.aiff 01_authentic_gonorego_rate140_pbas-10.wav

          # 2. 【重厚・超低音ドス】(rate 130, pbas -16, pmod 0)
          echo -n "[[rate 130]][[pbas -16]][[pmod 0]]" > p2.txt
          cat romaji.txt >> p2.txt
          say -v Whisper -f p2.txt -o p2.aiff
          afconvert -f WAVE -d LEI16 p2.aiff 02_extra_deep_menacing_rate130_pbas-16.wav

          # 3. 【激昂早口・ドス】(rate 155, pbas -10, pmod 0)
          echo -n "[[rate 155]][[pbas -10]][[pmod 0]]" > p3.txt
          cat romaji.txt >> p3.txt
          say -v Whisper -f p3.txt -o p3.aiff
          afconvert -f WAVE -d LEI16 p3.aiff 03_fast_rant_dosu_rate155_pbas-10.wav

          # 4. 【落ち着き・明瞭さ重視】(rate 135, pbas -6, pmod 0)
          echo -n "[[rate 135]][[pbas -6]][[pmod 0]]" > p4.txt
          cat romaji.txt >> p4.txt
          say -v Whisper -f p4.txt -o p4.aiff
          afconvert -f WAVE -d LEI16 p4.aiff 04_clear_paced_rate135_pbas-6.wav

          ls -la *.wav

      - name: Upload Audio Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gonorego-tuned-voices
          path: |
            01_authentic_gonorego_rate140_pbas-10.wav
            02_extra_deep_menacing_rate130_pbas-16.wav
            03_fast_rant_dosu_rate155_pbas-10.wav
            04_clear_paced_rate135_pbas-6.wav
            romaji.txt
          retention-days: 7

name: Generate Gonorego & Retro Voice

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      rate:
        description: 'Whisper 話速 (180〜210 推奨)'
        required: false
        default: '195'
        type: string

jobs:
  synthesize:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg via Homebrew
        run: |
          brew install ffmpeg

      - name: Install dependencies & Convert Japanese to Romaji
        run: |
          pip install pykakasi
          python convert.py
          ls -la romaji.txt

      - name: Synthesize Gonorego Voice & Audio Mastering
        run: |
          RATE="${{ github.event.inputs.rate }}"
          if [ -z "$RATE" ]; then
            RATE="195"
          fi
          echo "Synthesizing Gonorego Whisper with rate: $RATE"
          
          # 1. 原音生成 (AIFF -> WAV)
          say -v Whisper -r "$RATE" -f romaji.txt -o raw_whisper.aiff
          afconvert -f WAVE -d LEI16 raw_whisper.aiff gonorego_raw.wav

          # 2. 「どす」を利かせた低音強化・ピッチシフトマスタリング (Heavy Dosu Master)
          ffmpeg -y -i gonorego_raw.wav \
            -af "asetrate=44100*0.88,atempo=1.136,bass=g=10:f=150,equalizer=f=350:t=q:w=1:g=3,compand=attacks=0.01:decays=0.1:points=-60/-60|-20/-6|0/0,volume=2.2" \
            gonorego_heavy_dosu.wav

          # 3. 当時のFlash黄金期レトロ版 (22050Hz Mono / ローファイ感の再現)
          ffmpeg -y -i gonorego_heavy_dosu.wav -ar 22050 -ac 1 gonorego_flash_retro.wav

          ls -la gonorego_*.wav

      - name: Synthesize Retro SAM Voice (Software Automatic Mouth)
        continue-on-error: true
        run: |
          echo "Building SAM without SDL..."
          git clone --depth 1 https://github.com/s-macke/SAM.git
          cd SAM
          gcc -O2 *.c -o ../sam 2>/dev/null || gcc -O2 src/*.c -o ../sam 2>/dev/null || true
          cd ..
          if [ -f "./sam" ]; then
            SAM_TEXT=$(cat romaji.txt | tr '\n' ' ' | tr -s ' ' | head -c 1500)
            ./sam -wav zeijakusei_sam.wav "$SAM_TEXT"
            ls -la zeijakusei_sam.wav
          fi

      - name: Upload Audio Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeijakusei-gonorego-voices
          path: |
            gonorego_heavy_dosu.wav
            gonorego_flash_retro.wav
            gonorego_raw.wav
            zeijakusei_sam.wav
            romaji.txt
          if-no-files-found: warn
          retention-days: 7

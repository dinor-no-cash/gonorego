name: Generate Gonorego & Retro Voice

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Clean Phonetic Script
        run: |
          python convert.py
          ls -la romaji.txt

      - name: Synthesize Tuned Gonorego Patterns
        run: |
          # 1. 【本命】ドス・無機質フラット・適正速度 (rate 138, pbas -10, pmod 0)
          echo -n "[[rate 138]][[pbas -10]][[pmod 0]]" > p1.txt
          cat romaji.txt >> p1.txt
          say -v Whisper -f p1.txt -o p1.aiff
          afconvert -f WAVE -d LEI16 p1.aiff 01_authentic_gonorego_rate138_pbas-10.wav

          # 2. 【超重厚ドス】(rate 128, pbas -15, pmod 0)
          echo -n "[[rate 128]][[pbas -15]][[pmod 0]]" > p2.txt
          cat romaji.txt >> p2.txt
          say -v Whisper -f p2.txt -o p2.aiff
          afconvert -f WAVE -d LEI16 p2.aiff 02_extra_deep_rate128_pbas-15.wav

          # 3. 【明瞭まくし立て】(rate 145, pbas -8, pmod 0)
          echo -n "[[rate 145]][[pbas -8]][[pmod 0]]" > p3.txt
          cat romaji.txt >> p3.txt
          say -v Whisper -f p3.txt -o p3.aiff
          afconvert -f WAVE -d LEI16 p3.aiff 03_moderate_rate145_pbas-8.wav

          ls -la *.wav

      - name: Upload Audio Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gonorego-tuned-voices
          path: |
            01_authentic_gonorego_rate138_pbas-10.wav
            02_extra_deep_rate128_pbas-15.wav
            03_moderate_rate145_pbas-8.wav
            romaji.txt
          retention-days: 7
